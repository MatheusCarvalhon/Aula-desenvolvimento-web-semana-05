<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregável Semana 05 - APIs e Assincronismo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Projeto: Objetos, Dados e Assincronismo</h1>
    <p><em>*A Parte 1 (Manipulação de Dados) está rodando no Console (F12).</em></p>

    <section>
        <h2>Buscador de CEP</h2>
        <form id="form-cep">
            <input type="text" id="input-cep" placeholder="Digite o CEP (só números)" maxlength="9">
            <button type="submit" id="btn-cep">Buscar CEP</button>
        </form>
        <div id="status-cep" class="status"></div>
        <div id="resultado-cep"></div>
        
        <h3>Histórico de Pesquisas:</h3>
        <ul id="historico-cep"></ul>
    </section>

    <section>
        <h2>Mini Pokédex</h2>
        <form id="form-poke">
            <input type="text" id="input-poke" placeholder="Nome do Pokémon">
            <button type="submit" id="btn-poke">Buscar Pokémon</button>
        </form>
        <div id="status-poke" class="status"></div>
        <div id="resultado-poke"></div>
    </section>

    <script src="app.js"></script>
</body>
</html>
